<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Unimoda · Moda femenina argentina</title>
    <meta
      name="description"
      content="Unimoda: moda femenina argentina. Vestidos, tejidos, sastrería y básicos nobles. Envíos a todo el país, 6 cuotas sin interés y cambios gratis."
    />
    <meta name="theme-color" content="#F7F2EA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Rendimiento: se conoce antes de que cargue el JS. Vite reemplaza las rutas y las variables -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-normal.woff2" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Unimoda" />
    <meta property="og:title" content="Unimoda · Moda femenina argentina" />
    <meta
      property="og:description"
      content="Vestidos, tejidos, sastrería y básicos nobles. Envíos a todo el país, 6 cuotas sin interés y cambios gratis."
    />
    <meta property="og:url" content="https://juantrezza.github.io/Unimoda/" />
    <meta property="og:image" content="https://juantrezza.github.io/Unimoda/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // App shell: lo primero que se ve no espera a que cargue el JS. React lo reemplaza al montar, por eso
      // repite las clases de Layout, Header y HomePage (si cambian allá, cambiarlas acá). El panel tiene su layout.
      if (!location.hash.startsWith('#/admin')) {
        var isHome = (!location.hash || location.hash === '#/') && !location.search
        document.getElementById('root').innerHTML =
          '<div class="flex min-h-screen flex-col"><div class="bg-tinta px-4 py-2 text-center text-xs tracking-wide text-crema-50">Envío gratis desde $\u00a0150.000 · 6 cuotas sin interés</div>' +
          '<div class="border-b border-tinta/10 bg-crema/95"><div class="mx-auto flex h-16 max-w-site items-center justify-center px-4 sm:px-6 lg:h-20 lg:px-10"><span class="font-serif text-2xl tracking-tight lg:text-3xl">Unimoda</span></div></div>' +
          (isHome
            ? '<div class="container-site grid gap-8 pb-16 pt-6 md:grid-cols-12 md:items-center md:gap-10 md:pt-10 lg:pb-24"><div class="md:col-span-7 md:col-start-6"><div class="aspect-[4/5] overflow-hidden rounded-sm md:aspect-[5/6] lg:aspect-[6/7]">' +
              '<img src="%BASE_URL%images/editorial/hero.jpg" srcset="%BASE_URL%images/editorial/hero-360.webp 360w, %BASE_URL%images/editorial/hero-640.webp 640w, %BASE_URL%images/editorial/hero.webp 1024w" sizes="(min-width: 768px) 58vw, 88vw" alt="" width="1024" height="1280" fetchpriority="high" decoding="async" class="h-full w-full object-cover"></div></div></div>'
            : '') +
          '</div>'
      }
    </script>
    <noscript>Unimoda necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
