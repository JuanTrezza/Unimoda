<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Unimoda</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

  <!-- Estilos principales + Estilo propio -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="contacto.css">
</head>
<body>

<!-- NAV (igual al index) -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold brand-gradient" href="index.html">Unimoda</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
        <li class="nav-item"><a class="btn btn-brand" href="contacto.html">Contacto</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HEADER -->
<header class="contact-header text-center py-5">
  <div class="container" data-aos="fade-up">
    <h1 class="fw-bold">Contacto</h1>
    <p class="text-muted">Estamos para ayudarte. Mandanos tu consulta y te respondemos a la brevedad.</p>
  </div>
</header>

<!-- FORMULARIO -->
<section class="py-5 bg-light">
  <div class="container">
    <div class="row g-4 align-items-stretch">

      <!-- Form -->
      <div class="col-lg-7" data-aos="fade-right">
        <div class="card shadow-sm border-0 p-4">
          <form class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Nombre</label>
              <input type="text" class="form-control" placeholder="Tu nombre">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" placeholder="tu@email.com">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Asunto</label>
              <input type="text" class="form-control" placeholder="Motivo del mensaje">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Mensaje</label>
              <textarea class="form-control" rows="5" placeholder="Escribí tu consulta..."></textarea>
            </div>
            <div class="col-12">
              <button class="btn btn-brand w-100">Enviar mensaje</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Info -->
      <div class="col-lg-5" data-aos="fade-left">
        <div class="contact-info-box shadow-sm p-4 rounded">
          <h5 class="fw-bold mb-3">Información de contacto</h5>
          <p><i class="bi bi-envelope me-2"></i> unimoda.contacto@gmail.com</p>
          <p><i class="bi bi-geo-alt me-2"></i> Buenos Aires, Argentina</p>
          <p><i class="bi bi-clock me-2"></i> Lunes a Viernes: 9:00 to 18:00</p>

          <h6 class="fw-semibold mt-4">Seguinos</h6>
          <div class="d-flex gap-3 fs-4 mt-2">
            <a href="#" class="link-brand"><i class="bi bi-instagram"></i></a>
            <a href="#" class="link-brand"><i class="bi bi-facebook"></i></a>
            <a href="#" class="link-brand"><i class="bi bi-whatsapp"></i></a>
            <a href="#" class="link-brand"><i class="bi bi-tiktok"></i></a>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="text-center py-4 border-top bg-white">
  © <span id="year"></span> Unimoda — Todos los derechos reservados
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init();
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
